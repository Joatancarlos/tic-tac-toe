<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Jogo da Velha</h1>
    <div id="statusMsg" style="color: red; margin-bottom: 10px;"></div>

    <div id="auth-section" class="section active">
        <h3>Login / Registro</h3>
        <input type="text" id="username" placeholder="Usuário">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <button onclick="register()" style="background: #007bff;">Registrar</button>
    </div>

    <div id="lobby-section" class="section">
        <div class="match">
            <h3 id="welcomeMsg"></h3>
            <button onclick="createMatch()">Criar Nova Partida</button>
            <button onclick="logout()" style="background: #dc3545; margin-bottom: 15px;">Sair da Conta</button>
            <hr>
            <input type="text" id="matchIdInput" placeholder="ID da Partida">
            <button onclick="joinMatch()">Entrar na Partida</button>
        </div>
        <div class="ranking">
            <h3> Ranking de Jogadores</h3>

            <div id="rankingContainer" style="margin-top: 10px;">
                <div id="rankingList"></div>
            </div>
        </div>
    </div>

    <div id="game-section" class="section">
        <h3>Partida: <span id="displayMatchId" style="font-size: 0.6em; color: gray;"></span></h3>
        <button onclick="copyMatchId()" style="width: auto; padding: 5px 10px; margin-left: 10px; background: #6c757d; display: inline">
            Copiar
        </button>
        <h4 id="turnIndicator">Aguardando oponente...</h4>
        <div class="board" id="board">
        </div>
        <button onclick="leaveMatch()" style="background: #dc3545; margin-top: 20px;">Sair da Partida</button>
        <div id="activity-players" class="jogadores-online">
            <h3>Jogadores online</h3>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
